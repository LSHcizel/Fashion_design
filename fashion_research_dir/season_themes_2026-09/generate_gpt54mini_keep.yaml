theme: Sous le Salon la Plage
brand: Chanel
description: 'Away from the Paris salon, Chanel found in Biarritz a new way of being,
  a new vantage point, bodily rhythm, and forms of freedom. With this line as a prologue,
  creative director Matthieu Blazy formally brings Chanel back to where it all began.
  In 1915, Gabrielle Chanel took the bold step that would rewrite fashion history:
  encouraged by her lover, polo player Boy Capel, she expanded beyond her Deauville
  boutique and founded her first couture house in the nineteenth-century Villa Larralde.
  Set beside the beach, grand hotels, and casinos, the location drew an international
  elite and delivered Chanel''s decisive victory—financial independence achieved as
  a powerful woman entrepreneur. More than a century later, Chanel returns to the
  birthplace of its enduring aesthetic.


  More than a hundred years on, Chanel staged its first runway show in the beautiful
  Basque coastal city at Le Casino Municipal, with the Cruise 2027 collection capturing
  the house''s lasting spirit of liberation. Though Biarritz is a historic turning
  point for the brand—it is where Gabrielle Chanel first met perfumer Ernest Beaux,
  leading to the legendary Chanel N°5—this was nevertheless the maison''s first-ever
  runway presentation in Biarritz.


  For Blazy, the location is deeply meaningful on both personal and creative levels.
  Having often visited the Basque Country since childhood, he understands this seaside
  town as a symbol of "absolute freedom" for himself and for the brand alike. To prove
  that classics often spring from rebellion, Blazy opened with a tribute to Gabrielle
  Chanel''s 1926 black dress. He noted: "People often speak of a so-called ''revenge
  dress''; this may be the original version," and returned to the earliest archival
  sketches. That austere, unadorned long dress was hailed by Vogue as Chanel''s "Ford";
  Blazy focused on a detail overlooked in early published drawings—the large bow at
  the back—and translated it ingeniously into the clutch of the first look.


  Chanel once made society women covet the dress of the contemporary working woman,
  breaking class barriers. Blazy continues that tradition throughout Cruise, elevating
  French workwear classics—the sailor''s marinière stripe shirt, the traditional bleu
  de travail worker''s jacket, and washed cotton-canvas tailoring—to unparalleled
  luxury. Under the theme of "aligning the eternal natural world with the modern world,"
  he loosens rigid dress codes so salon elegance flows naturally onto the beach. Basque
  stripes thread through the entire high-craft collection. The runway rhythm keeps
  shifting, celebrating the pure pleasure of dressing and undressing—with swimwear
  in a pivotal role. Models wear flowing silk scarf sets, rustling raffia skirts,
  supple tweed, soft beaded knitwear, and sequins that shimmer like fish scales in
  a "mermaid fantasy." Even the classic Double C logo is reinterpreted: no longer
  mere branding, it becomes a structural, architectural element of the garments.


  Accessories reinforce the collection''s play across terrains. Bags range from compact
  luggage and waterproof flap styles to oversized striped beach paniers and traditional
  Basque pala carry bags. Footwear lets the wearer move freely between ballroom and
  sand—from elegant Art Deco heels to inventive barefoot "heel plates." Jewelry echoes
  the city''s architecture and marine life, closing with shell earrings and a "spiritual
  return" of iconic Chanel pearls.


  In this spirit, Blazy''s Cruise 2027 elegantly reframes Chanel''s early Atlantic-coast
  advocacy of sporty elegance through a contemporary lens. The runway is filled with
  modern interpretations of her revolutionary clean lines, fluid dresses, and unbound
  silhouettes—directly echoing Chanel''s original mission to liberate women from early-twentieth-century
  sartorial constraints so they could dance, swim, love, and bask in the sun without
  heed for others'' gaze.


  Inside Le Casino Municipal, the atmosphere blends the relaxed grandeur of the French
  coast with the historical weight of a major fashion milestone. A star-studded front
  row—including A$AP Rocky, Nicole Kidman, Sofia Coppola, and Tilda Swinton—witnessed
  Blazy''s luminous homage to the house''s roots.


  By seamlessly interweaving the heritage of 1915 with its present-day expression,
  Matthieu Blazy again proves that Biarritz''s spirit of liberation remains vividly
  alive within Chanel. Cruise 2027 is not only a salute to the past but a celebration
  of freedom and ease—and an enduring tribute to the designer who dared to change
  the world.

  '
