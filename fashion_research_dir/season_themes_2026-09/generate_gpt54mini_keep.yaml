task-notes:
  theme-analysis:
  - When description is provided, extract description-derived key elements in English
    before the final THEME_ANALYSIS
  - Key aspects are holistic analysis only; produce exactly num-chapters sub-themes
    that synthesize across key aspects (not 1:1)
  - 'Write the style the DesignMerit judge can score: one identifying idea per later
    look, newer than this house''s interchangeable wardrobe, and still this theme'
  - A mood word, a theme duality, or another theme's garment is not a stronger style
  concept-brainstorming:
  - 'Each chapter names 2-4 look ideas the judge scores as design: a surface field,
    an edge path, or a same-theme inner worn open'
  - Each next idea updates the style and the combination, not only the color, material,
    or brand
  - Do not invent novelty with two sleeve states, two bottoms, two shoes, or a garment
    from another theme
  design-elements-proposal:
  - Weight the elements that remain after color, material, and brand words are swapped
  - Craft that counts is a surface or an edge on one garment. Factory finishing is
    not an identifying element
  - Keep each chapter's elements stylistically distinct inside the same theme
  look-description-generation:
  - Open with one identifying idea and ground it on a part or layer, then write outer
    to inner
  - The paragraph should read as this collection's style. A closing mood clause does
    not create that style
  - Do not stack a second binding, a second bottom, or a second shoe to look more
    designed
